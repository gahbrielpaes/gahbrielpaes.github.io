<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabriel Michell Paes — Currículo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #2783DE;
      --blue-soft: #E5F2FC;
      --text: #2C2C2B;
      --secondary: #7D7A75;
      --canvas: #FFFFFF;
      --surface: #F9F8F7;
      --surface2: #F0EFED;
      --border: #E6E5E3;
      --radius: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(135deg, #1a5fa8 0%, #2783DE 60%, #4fa3f0 100%);
      color: #fff;
      padding: 64px 24px;
      text-align: center;
    }
    .hero-inner {
      max-width: 760px;
      margin: 0 auto;
    }
    .hero-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 20px;
      border: 3px solid rgba(255,255,255,0.6);
      overflow: hidden;
      background: rgba(255,255,255,0.2);
    }
    .hero-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .hero-title {
      font-size: 1.05rem;
      opacity: 0.88;
      margin-bottom: 24px;
      font-weight: 400;
    }
    .hero-contacts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .hero-contacts a, .hero-contacts span {
      color: #fff;
      opacity: 0.9;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .hero-contacts a:hover { background: rgba(255,255,255,0.25); text-decoration: none; }

    .btn-download-pdf {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #1a5fa8 !important;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 0.92rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-download-pdf:hover {
      text-decoration: none;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    }

    /* ── LAYOUT ── */
    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 24px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 32px;
      align-items: start;
    }
    @media (max-width: 700px) {
      .page { grid-template-columns: 1fr; padding: 32px 16px; }
    }

    /* ── CARD ── */
    .card {
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 24px;
    }
    .card:last-child { margin-bottom: 0; }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 20px;
    }

    /* ── PROFILE ── */
    .profile-text {
      color: var(--secondary);
      font-size: 0.97rem;
      line-height: 1.7;
    }
    .profile-text + .profile-text { margin-top: 12px; }

    /* ── EXPERIENCE ── */
    .exp-list { list-style: none; }
    .exp-item {
